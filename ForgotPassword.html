<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | TYPE Digital Solutions</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="auth-shell">
        <section class="auth-card">
            <a class="brand" href="index.html">TDS<span>.</span></a>
            <span class="eyebrow">TYPE DIGITAL SOLUTIONS PORTAL</span>
            <h1 id="authHeading">Forgot account</h1>
            <p class="muted" id="authSubtext">Enter your email to receive an email to create a new password.</p>

            <div class="auth-tabs">
                <a class="btn" href="login.html" id="tabSignInLink">Sign in</a>
                <a class="btn" href="createAcc.html" id="tabCreateAccLink">Create account</a>
                <a class="btn btn-primary" href="ForgotPassword.html" id="tabForgotLink">Forgot account</a>
            </div>

            <form id="forgotAccountForm" class="client-form" aria-label="Forgot account">
                <label for="forgotEmailInput">Enter email</label>
                <input type="email" id="forgotEmailInput" placeholder="Enter your email address" required>

                <button type="submit" class="btn btn-primary" id="sendPasswordResetBtn">Send email to create new password</button>
            </form>

            <form id="setPasswordForm" class="client-form" hidden aria-label="Create new password">
                <label for="setupEmailDisplay">Account email</label>
                <input type="email" id="setupEmailDisplay" readonly>

                <label for="setupPasswordInput">Create password (min. 6 characters)</label>
                <input type="password" id="setupPasswordInput" placeholder="Create new password" minlength="6" required>

                <label for="setupConfirmPasswordInput">Confirm password</label>
                <input type="password" id="setupConfirmPasswordInput" placeholder="Confirm new password" minlength="6" required>

                <button type="submit" class="btn btn-primary" id="saveSetupPasswordBtn">Save password &amp; sign in</button>
            </form>

            <p id="authFeedback" aria-live="polite"></p>

            <p class="back-link"><a href="login.html">← Back to sign in</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>

</html>
