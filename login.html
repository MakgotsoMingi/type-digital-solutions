<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | TYPE Digital Solutions</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <main class="auth-shell">
        <section class="auth-card">
            <a class="brand" href="index.html">TDS<span>.</span></a>
            <span class="eyebrow">TYPE DIGITAL SOLUTIONS PORTAL</span>
            <h1 id="authHeading">Sign in to workspace</h1>
            <p class="muted" id="authSubtext">Sign in with your workspace credentials.</p>

            <div class="auth-tabs">
                <a class="btn btn-primary" href="login.html" id="tabSignInLink">Sign in</a>
                <a class="btn" href="createAcc.html" id="tabCreateAccLink">Create account</a>
                <a class="btn" href="ForgotPassword.html" id="tabForgotLink">Forgot account</a>
            </div>

            <form id="tempLoginForm" class="client-form" aria-label="Sign in">
                <label for="loginRoleSelect">Account role</label>
                <select id="loginRoleSelect" aria-label="Workspace role">
                    <option value="admin">Business / Admin</option>
                    <option value="client">Client</option>
                </select>

                <label for="loginCompanyInput">Company or full name</label>
                <input type="text" id="loginCompanyInput" placeholder="e.g. TYPE Digital Solutions">

                <label for="loginEmailInput">Email address</label>
                <input type="email" id="loginEmailInput" placeholder="name@company.co.za" required>

                <label for="loginPasswordInput">Password</label>
                <input type="password" id="loginPasswordInput" placeholder="Enter your password" required>

                <button type="submit" class="btn btn-primary" id="signInSubmitBtn">Sign in to workspace</button>
            </form>

            <p id="authFeedback" aria-live="polite"></p>

            <p class="back-link"><a href="index.html">← Back to main website</a></p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
</body>

</html>
